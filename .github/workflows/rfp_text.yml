name: RFP Text Pipeline

on:
  workflow_dispatch:
    inputs:
      max_api_calls:
        description: "Cap on paginated search calls this run (each = up to 1000 opps; SAM free tier ~1000/day). Backfill default: 200."
        required: false
        default: "200"
      naics:
        description: "Space-separated NAICS codes to query. Backfill default is the full 11-code list."
        required: false
        default: "541511 541512 541513 541519 518210 541330 541611 541618 541690 541715 541990"
      start_date:
        description: "First-run window start YYYY-MM-DD (ignored if state already has a cursor)"
        required: false
        default: ""
      dry_run:
        description: "Probe first page only; no downloads"
        type: boolean
        default: false
      force_window_start:
        description: "Backfill: override state and scan from this date YYYY-MM-DD. Leave blank for normal run."
        required: false
        default: ""
      include_award_notices:
        description: "Process Award Notice attachments (off by default — high volume, less useful)"
        type: boolean
        default: false
  # schedule:
  #   # Daily at 00:05 UTC. Schedule runs receive no `inputs`, so the bash
  #   # `||` fallbacks below kick in: 10 API calls and 4 NAICS — enough to
  #   # cover the previous day's IT solicitations within a tight quota.
  #   - cron: "5 0 * * *"
  # Paused 2026-05-19 (OpenAI quota exhausted; SAM 500s). Re-enable by uncommenting.

permissions:
  contents: write

concurrency:
  group: rfp-text
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: inputs.dry_run != true
        run: python -m playwright install --with-deps chromium

      - name: Run RFP text pipeline
        run: |
          # Cron defaults (no inputs): 10 calls, 4 NAICS — daily incremental.
          # workflow_dispatch defaults: 200 calls, 11 NAICS — backfill mode.
          MAX_CALLS="${{ inputs.max_api_calls || '10' }}"
          NAICS="${{ inputs.naics || '541511 541512 541519 518210' }}"
          ARGS="--max-api-calls $MAX_CALLS --naics-prefix $NAICS --summary-file $GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.force_window_start }}" ]; then
            ARGS="$ARGS --force-window-start ${{ inputs.force_window_start }}"
          elif [ -n "${{ inputs.start_date }}" ]; then
            ARGS="$ARGS --start-date ${{ inputs.start_date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.include_award_notices }}" = "true" ]; then
            ARGS="$ARGS --include-award-notices"
          fi
          python rfp_text_pipeline.py $ARGS

      - name: Extract personnel roles from new bundles
        if: always() && inputs.dry_run != true
        run: python extract_personnel.py

      # Rebuild even when the pipeline exited 1 (e.g. SAM 429 mid-window) —
      # bundles already pushed to R2 this run should still make it to the dashboard.
      - name: Rebuild dashboard JSONs from R2
        if: always() && inputs.dry_run != true
        run: python build_rfp_signals.py

      - name: Run data tests
        if: always() && inputs.dry_run != true
        run: python -m pytest tests/data/ -v --tb=short

      - name: Run frontend tests
        if: always() && inputs.dry_run != true
        run: python -m pytest tests/frontend/ -v --tb=short

      # Raise the baseline floor only after both test suites pass — so a
      # regression that drops legit bundles still fails. Dedup-by-sol#
      # legitimately rotates noticeIds when SAM reposts; this updates the
      # floor so those rotations don't fail the next run.
      - name: Update baseline (raise the floor)
        if: always() && inputs.dry_run != true
        run: python tests/data/update_baseline.py

      - name: Commit updated dashboard JSONs
        id: commit
        if: always() && inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/rfp_signals.json web/data/rfp_bundles.json tests/data/baseline.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild RFP dashboard JSONs"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Vercel used to watch this repo and build on push, so publishing needed
      # no step of its own. Cloudflare Pages is a direct upload, so it does.
      # Outside the commit step deliberately: web/ holds the dashboard itself,
      # not just the JSONs this job rebuilds, and deploying only when the data
      # changed would leave edits to the page unpublished.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web --project-name=sam-it-notices --branch=main --commit-dirty=true
